<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Game Loader</title>
    <style>
        html, body {
            margin: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
        }

        iframe {
            width: 100%;
            height: 100%;
            border: 0;
        }
    </style>
</head>
<body>

<iframe id="game"></iframe>

<script>
(async () => {
    const htmlURL =
      "https://cdn.jsdelivr.net/gh/amirbrohgame/GamePortal@main/main.html";

    const response = await fetch(htmlURL);

    if (!response.ok) {
        throw new Error("Game failed to load");
    }

    const html = await response.text();

    const blob = new Blob(
        [html],
        { type: "text/html" }
    );

    document.getElementById("game").src =
        URL.createObjectURL(blob);
})();
</script>

</body>
</html>
